name: ETF Trend Monitor

on:
  schedule:
    - cron: '0 23 * * 1-5' # Run at a set time after the market closes, Monday through Friday (UTC time).
  workflow_dispatch:      # Allows you to manually click to run on the GitHub webpage.
  repository_dispatch:    # Allows external remote wake-up via API
    types: [ telegram_trigger ]

permissions:
  contents: write

jobs:
  run-etf-trend-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f quant_trade/requirements.txt ]; then pip install -r quant_trade/requirements.txt; fi

      - name: Execute Pipeline
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PUBLIC_CHANNEL_ID: ${{ secrets.PUBLIC_CHANNEL_ID }}
          MESSAGE_ID: ${{ github.event.client_payload.message_id }}
          CHAT_ID_FROM_PAYLOAD: ${{ github.event.client_payload.chat_id }}
        run: python quant_trade/track_etf.py

      - name: Debug repository name
        if: failure()
        run: |
          echo "Repository: ${{ github.repository }}"

      - name: Send failure notification
        if: failure()
        env:
          CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          REPO_NAME: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          # 使用 jq 安全地构建 JSON，完全避免 shell 转义问题
          MESSAGE="⚠️ *ETF Trend Monitor - Daily Run Failed*

          Please check the Actions log for details:
          ${SERVER_URL}/${REPO_NAME}/actions/runs/${RUN_ID}"

          # 用 jq 构建 JSON 负载，然后用 curl 发送
          echo "${MESSAGE}" | jq -R -s '{
            chat_id: $ENV.CHAT_ID,
            text: .,
            parse_mode: "Markdown"
          }' | curl -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d @-
          
      - name: Commit and Push Dashboard
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions Bot"
          git add docs/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update dashboard snapshot" && git push)
